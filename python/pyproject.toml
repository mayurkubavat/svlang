[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svlang-lint"
version = "0.6.2"
description = "Python Plugin SDK for svlang-lint Static Linter"
readme = "README.md"
authors = [{ name = "Mayur Kubavat", email = "mkubavat01@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
svlang-lint-plugins = "svlang_lint.plugin_runner:main"
svlang-lint-report = "svlang_lint.report:main"

# Only the SDK is packaged; examples/ and tests/ stay in the repository.
[tool.setuptools]
packages = ["svlang_lint"]
