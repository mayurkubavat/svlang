[package]
name = "svlang-cli"
description = "The unified svlang command line: check, lint, LSP server, filelists, UVM testbench map, hierarchy, syntax tree, netlist, Btor2, AIGER and Yosys JSON"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "compilers", "development-tools"]

[[bin]]
name = "svlang"
path = "src/main.rs"

[dependencies]
svlang = { version = "0.4.0", path = "../svlang" }
svlang-model = { version = "0.4.0", path = "../svlang-model" }
svlang-lint = { version = "0.4.0", path = "../svlang-lint" }
svlang-lsp = { version = "0.4.0", path = "../svlang-lsp" }
