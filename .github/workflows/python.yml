name: Python

# Wheels for pysvlang (crates/svlang-py): one abi3 wheel per platform, each
# tested with pytest, plus an sdist. Nothing is published from here yet; the
# wheels are kept as workflow artifacts.
on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.lock", ".github/workflows/python.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.lock", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-2022, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/svlang-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist

      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --no-index --find-links crates/svlang-py/dist pysvlang
          python -m pytest -q crates/svlang-py/tests

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: crates/svlang-py/dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/svlang-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/svlang-py/dist/*.tar.gz
