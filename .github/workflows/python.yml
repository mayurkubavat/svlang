name: Python

# Wheels for pysvlang (crates/svlang-py): one abi3 wheel per platform, each
# tested with pytest, plus an sdist, kept as workflow artifacts. Pushing a tag
# pysvlang-vX.Y.Z (matching the workspace version) also publishes them to PyPI
# through trusted publishing (no token): the PyPI project must list this
# repository, workflow python.yml and environment pypi as a trusted publisher.
on:
  push:
    branches: [main]
    tags: ["pysvlang-v*"]
    paths: ["crates/**", "Cargo.lock", ".github/workflows/python.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.lock", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-2022, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/svlang-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist

      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --no-index --find-links crates/svlang-py/dist pysvlang
          python -m pytest -q crates/svlang-py/tests

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: crates/svlang-py/dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/svlang-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/svlang-py/dist/*.tar.gz

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/pysvlang-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pysvlang
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the package version
        run: |
          want=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag=${GITHUB_REF_NAME#pysvlang-v}
          if [ "$tag" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $want" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
