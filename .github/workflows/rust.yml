name: Rust

# The native Rust tools (dv-lint, dv-lsp, dv-build, dv-map, dv-filelist):
# format and Clippy gate, then the tests, with default features only. The
# `slang` feature needs the C++ model library and is not built here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # rust-toolchain.toml names the version (and its components).
          rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-

      - name: hygiene (no assistant state, keys or attribution)
        run: tools/gates/hygiene.sh

      - name: rust_gate (profiles, fmt, Clippy -D warnings)
        run: tools/gates/rust_gate.sh --native

      - name: cargo test
        run: cargo test --locked

      - name: Rule docs are generated from the rules
        run: |
          cargo build --locked -p dv-lint --bin svlang-lint
          python3 tools/codegen/gen_rule_docs.py --binary target/debug/svlang-lint --check

  msrv:
    name: test (MSRV 1.82, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install 1.82 --profile minimal
          # rust-toolchain.toml would win over a default; this job's cargo
          # calls must use the MSRV.
          echo "RUSTUP_TOOLCHAIN=1.82" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.82-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.82-

      - name: cargo test
        run: cargo test --locked

  package:
    # What the Release workflow ships, built and checked on every change:
    # the dist profile, the archive layout and a lint run from the unpacked
    # archive (tools/release/).
    name: release archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # rust-toolchain.toml names the version.
          rustup toolchain install

      - name: Build
        run: cargo build --locked --profile dist

      - name: Package and smoke test
        run: |
          tools/release/package.sh target/dist linux-x64 dist
          tools/release/smoke.sh dist/svlang-lint-linux-x64.tar.gz

  error-budget:
    # ERROR findings on reviewed, simulator-clean code (Accellera uvm-core)
    # are false positives until shown otherwise. Each rule has a budget
    # (tools/quality/error_budget.json) that can only go down; see
    # tools/quality/error_budget.py.
    name: ERROR budget (uvm-core)
    runs-on: ubuntu-24.04
    env:
      UVM_CORE_REF: 2020.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # rust-toolchain.toml names the version.
          rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-budget-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-budget-

      - name: Build
        run: cargo build --locked --release -p dv-lint --bin svlang-lint

      - name: Fetch uvm-core
        run: git clone --depth 1 --branch "$UVM_CORE_REF" https://github.com/accellera-official/uvm-core.git uvm-core

      - name: ERROR budget
        env:
          UVM_HOME: ${{ github.workspace }}/uvm-core
        run: python3 tools/quality/error_budget.py --binary target/release/svlang-lint

  playground:
    # The browser build (crates/svlang-wasm): svlang as WebAssembly, checked from Node.
    name: playground (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # rust-toolchain.toml names the version (and the wasm target).
          rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-wasm-

      - name: Build and check
        run: crates/svlang-wasm/www/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: |
            crates/svlang-wasm/www/index.html
            crates/svlang-wasm/www/svlang.js
            crates/svlang-wasm/www/svlang.wasm
          retention-days: 14
