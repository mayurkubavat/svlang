name: Rust

# Pure-Rust workspace CI: format and Clippy gate, unit/integration tests,
# end-to-end Python integration suites (`tests/` + Python rule SDK), MSRV 1.82
# check, release archive + smoke test, uvm-core ERROR budget, and WASM build.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-

      - name: hygiene (no assistant state, keys or attribution)
        run: tools/gates/hygiene.sh

      - name: rust_gate (guidelines, fmt, Clippy -D warnings)
        run: tools/gates/rust_gate.sh

      - name: cargo test
        run: cargo test --locked

      - name: Rule docs are generated from the rules
        run: |
          cargo build --locked -p svlang-cli --bin svlang
          python3 tools/codegen/gen_rule_docs.py --binary target/debug/svlang --check

      - name: Netlist gate
        run: SVLANG=target/debug/svlang python3 tools/gates/netlist_gate.py

  integration:
    name: end-to-end suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-int-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-int-

      - name: Build svlang (release)
        run: cargo build --locked --release -p svlang-cli --bin svlang

      - name: End-to-end CLI, fix-invariant, and Python SDK suites
        run: |
          for t in baseline catalog changed explain fix_invariants guidelines history init map precision waivers; do
            echo "== tests/test_$t.py"
            python3 "tests/test_$t.py" --binary target/release/svlang
          done
          echo "== python/tests/test_python_rules.py"
          python3 python/tests/test_python_rules.py --binary target/release/svlang

  msrv:
    name: test (MSRV 1.82, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install 1.82 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.82" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.82-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.82-

      - name: cargo test
        run: cargo test --locked

  package:
    name: release archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --locked --profile dist -p svlang-cli

      - name: Package and smoke test
        run: |
          tools/release/package.sh target/dist linux-x64 dist
          tools/release/smoke.sh dist/svlang-linux-x64.tar.gz

  error-budget:
    name: ERROR budget (uvm-core)
    runs-on: ubuntu-24.04
    env:
      UVM_CORE_REF: 2020.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-budget-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-budget-

      - name: Build
        run: cargo build --locked --release -p svlang-cli --bin svlang

      - name: Fetch uvm-core
        run: git clone --depth 1 --branch "$UVM_CORE_REF" https://github.com/accellera-official/uvm-core.git uvm-core

      - name: ERROR budget
        env:
          UVM_HOME: ${{ github.workspace }}/uvm-core
        run: python3 tools/quality/error_budget.py --binary target/release/svlang

  playground:
    name: playground (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-wasm-

      - name: Build and check
        run: crates/svlang-wasm/www/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: |
            crates/svlang-wasm/www/index.html
            crates/svlang-wasm/www/svlang.js
            crates/svlang-wasm/www/svlang.wasm
          retention-days: 14
