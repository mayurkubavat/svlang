name: Precision

# Nightly: lint real UVM code with every rule (`svlang lint`) and compare each
# rule's finding count with the previous night.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  UVM_CORE_REF: 2020.3.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  precision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-precision-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-precision-

      - name: Build svlang
        run: cargo build --locked --release -p svlang-cli --bin svlang

      - name: Fetch uvm-core
        run: git clone --depth 1 --branch "$UVM_CORE_REF" https://github.com/accellera-official/uvm-core.git uvm-core

      - name: Restore previous result
        uses: actions/cache/restore@v4
        with:
          path: precision-previous.json
          key: precision-${{ github.run_id }}
          restore-keys: precision-

      - name: Measure
        env:
          UVM_HOME: ${{ github.workspace }}/uvm-core
        run: |
          python3 tools/quality/precision.py --binary target/release/svlang --out precision.json \
            --previous precision-previous.json --summary precision.md
          cp precision.json precision-previous.json

      - name: Save result for the next run
        uses: actions/cache/save@v4
        with:
          path: precision-previous.json
          key: precision-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: precision
          path: |
            precision.json
            precision.md
          retention-days: 30
