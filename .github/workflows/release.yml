name: Release

# On a version tag: build the native tools (svlang-lint, dv-lsp, dv-build,
# dv-map, dv-filelist) for Linux x64/arm64, macOS arm64/x64, and Windows x64
# and attach them to the GitHub release as svlang-lint-<target>.tar.gz. The
# C++ engine on Slang is built too, as svlang-lint-slang-<target>.tar.gz. The
# `svlang.svlang` VS Code / Open VSX extension is packaged for all 5 platforms
# with `dv-lsp` bundled inside, attached to the GitHub release, and published
# to Open VSX (when OVSX_PAT is set) and VS Code Marketplace (via OIDC Trusted
# Publishing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built in manylinux_2_28, so they run on any
          # distribution with glibc 2.28 or later (RHEL 8, Ubuntu 20.04).
          # Not musl: its allocator makes the parallel rule run about ten
          # times slower.
          - os: ubuntu-24.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - os: macos-15
            target: darwin-x64
            triple: x86_64-apple-darwin
          - os: windows-2022
            target: win32-x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml pins the Rust version; install it and add the release target.
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.triple }}

      - name: Build
        shell: bash
        run: cargo build --locked --profile dist --target ${{ matrix.triple }}

      - name: Package
        shell: bash
        run: tools/release/package.sh "target/${{ matrix.triple }}/dist" "${{ matrix.target }}" dist

      - name: Smoke test
        # The x64 macOS binaries run under Rosetta on the arm64 runner.
        shell: bash
        run: tools/release/smoke.sh "dist/svlang-lint-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/svlang-lint-${{ matrix.target }}.tar.gz

  slang:
    name: slang (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: cmake --preset reference && cmake --build build -j 4 --target svlang-lint

      - name: Smoke test
        run: |
          ./build/svlang-lint --list-rules --json - > /dev/null
          python3 cpp/tests/regression.py --binary build/svlang-lint

      - name: Package
        run: |
          mkdir -p dist/svlang-lint-slang-${{ matrix.target }}/bin
          cp build/svlang-lint dist/svlang-lint-slang-${{ matrix.target }}/bin/svlang-lint-slang
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/svlang-lint-slang-${{ matrix.target }}/
          tar -C dist -czf "dist/svlang-lint-slang-${{ matrix.target }}.tar.gz" "svlang-lint-slang-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: slang-${{ matrix.target }}
          path: dist/svlang-lint-slang-${{ matrix.target }}.tar.gz

  publish:
    needs: [native, slang]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the VS Code / Open VSX extension per platform
        working-directory: editors/vscode
        run: |
          npm ci
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            bin_name=dv-lsp
            case "$target" in
              win32-*) bin_name=dv-lsp.exe ;;
            esac
            rm -rf bin stage && mkdir -p "bin/$target" stage
            tar -C stage -xzf "../../artifacts/svlang-lint-$target.tar.gz"
            # The one server the extension starts.
            cp "stage/svlang-lint-$target/bin/$bin_name" "bin/$target/$bin_name"
            if [ "$bin_name" = "dv-lsp" ]; then
              chmod +x "bin/$target/$bin_name"
            fi
            npx vsce package --target "$target" -o "../../artifacts/svlang-$target.vsix"
          done
          rm -rf bin stage

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-packages
          path: artifacts/svlang-*.vsix

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum svlang-lint-*.tar.gz svlang-*.vsix > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              svlang-lint-*.tar.gz svlang-*.vsix SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes \
              svlang-lint-*.tar.gz svlang-*.vsix SHA256SUMS
          fi

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set; skipping Open VSX publish."
            exit 0
          fi
          for vsix in ../../artifacts/svlang-*.vsix; do
            echo "Publishing $vsix to Open VSX..."
            npx ovsx publish --skip-duplicate "$vsix"
          done

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        run: |
          for vsix in ../../artifacts/svlang-*.vsix; do
            echo "Publishing $vsix to VS Code Marketplace via OIDC Trusted Publishing..."
            npx vsce publish --oidc --skip-duplicate --packagePath "$vsix"
          done
