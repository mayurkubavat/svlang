name: Release

# On a version tag: build the unified `svlang` native binary for Linux x64/arm64,
# macOS arm64/x64, and Windows x64 and attach them to the GitHub release as
# svlang-<target>.tar.gz. The `svlang.svlang` VS Code / Open VSX extension is
# packaged for all 5 platforms with `svlang` bundled inside, attached to the
# GitHub release, and published to Open VSX and VS Code Marketplace via OIDC
# Trusted Publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_extensions:
        description: "Publish svlang.svlang .vsix packages to Open VSX and VS Code Marketplace"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built in manylinux_2_28, so they run on any
          # distribution with glibc 2.28 or later (RHEL 8, Ubuntu 20.04).
          # Not musl: its allocator makes the parallel rule run about ten
          # times slower.
          - os: ubuntu-24.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - os: macos-15
            target: darwin-x64
            triple: x86_64-apple-darwin
          - os: windows-2022
            target: win32-x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml pins the Rust version; install it and add the release target.
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.triple }}

      - name: Build
        shell: bash
        run: cargo build --locked --profile dist -p svlang-cli --target ${{ matrix.triple }}

      - name: Package
        shell: bash
        run: tools/release/package.sh "target/${{ matrix.triple }}/dist" "${{ matrix.target }}" dist

      - name: Smoke test
        # The x64 macOS binaries run under Rosetta on the arm64 runner.
        shell: bash
        run: tools/release/smoke.sh "dist/svlang-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/svlang-${{ matrix.target }}.tar.gz

  publish:
    needs: [native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the VS Code / Open VSX extension per platform
        working-directory: editors/vscode
        run: |
          npm ci
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            bin_name=svlang
            case "$target" in
              win32-*) bin_name=svlang.exe ;;
            esac
            rm -rf bin ../../stage && mkdir -p "bin/$target" ../../stage
            tar -C ../../stage -xzf "../../artifacts/svlang-$target.tar.gz"
            # The unified svlang binary (run as `svlang lsp` by the extension).
            cp "../../stage/svlang-$target/bin/$bin_name" "bin/$target/$bin_name"
            if [ "$bin_name" = "svlang" ]; then
              chmod +x "bin/$target/$bin_name"
            fi
            rm -rf ../../stage
            npx vsce package --target "$target" -o "../../artifacts/svlang-$target.vsix"
          done
          rm -rf bin ../../stage

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-packages
          path: artifacts/svlang-*.vsix

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum svlang-*.tar.gz svlang-*.vsix > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              svlang-*.tar.gz svlang-*.vsix SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes \
              svlang-*.tar.gz svlang-*.vsix SHA256SUMS
          fi

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_extensions == true
        working-directory: editors/vscode
        run: |
          for vsix in ../../artifacts/svlang-*.vsix; do
            echo "Publishing $vsix to Open VSX via OIDC Trusted Publishing..."
            npx ovsx publish --trusted-publishing --skip-duplicate "$vsix"
          done

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_extensions == true
        working-directory: editors/vscode
        run: |
          for vsix in ../../artifacts/svlang-*.vsix; do
            echo "Publishing $vsix to VS Code Marketplace via OIDC Trusted Publishing..."
            npx vsce publish --oidc --skip-duplicate --packagePath "$vsix"
          done
