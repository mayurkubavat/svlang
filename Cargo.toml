# The Rust workspace: the pure-Rust IEEE 1800-2023 SystemVerilog compiler SDK,
# UVM/RAL model, static linter, LSP server, and unified `svlang` CLI.
# Crates live in crates/; see docs/architecture/rust.md.
[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/sv-source", "crates/sv-lexer", "crates/sv-preprocessor", "crates/sv-syntax", "crates/sv-semantic",
    "crates/sv-netlist", "crates/sv-btor2", "crates/sv-aiger", "crates/sv-yosys", "crates/svlang",
    "crates/svlang-model", "crates/svlang-lint", "crates/svlang-lsp", "crates/svlang-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/mayurkubavat/svlang"
keywords = ["systemverilog", "verilog", "eda", "parser", "hdl"]
categories = ["compilers", "parser-implementations", "development-tools"]

[profile.release]
debug = 1

# Release binaries people download (the Release workflow): no debug info,
# stripped, optimized across crates.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "thin"
codegen-units = 1
