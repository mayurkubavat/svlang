# The Rust workspace: the pure-Rust IEEE 1800-2023 SystemVerilog compiler SDK,
# UVM/RAL model, static linter, LSP server, and unified `svlang` CLI.
# Crates live in crates/; see docs/architecture/rust.md.
[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/sv-source", "crates/sv-lexer", "crates/sv-preprocessor", "crates/sv-syntax",
    "crates/sv-bigint", "crates/sv-fxhash", "crates/sv-scopes", "crates/sv-checks", "crates/sv-ir",
    "crates/sv-expr", "crates/sv-semantic",
    "crates/sv-netlist", "crates/sv-btor2", "crates/sv-aiger", "crates/sv-yosys", "crates/svlang",
    "crates/svlang-model", "crates/svlang-lint", "crates/svlang-lsp", "crates/svlang-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/mayurkubavat/svlang"
keywords = ["systemverilog", "verilog", "eda", "parser", "hdl"]
categories = ["compilers", "parser-implementations", "development-tools"]

# Every internal crate, declared once; members write `sv-syntax.workspace = true`.
# Each entry keeps both `version` (what crates.io resolves; keep it equal to
# `workspace.package.version`) and `path` (what the workspace builds), so
# `cargo publish` in tools/release/publish_crates.sh keeps working.
[workspace.dependencies]
sv-source = { version = "0.4.0", path = "crates/sv-source" }
sv-bigint = { version = "0.4.0", path = "crates/sv-bigint" }
sv-fxhash = { version = "0.4.0", path = "crates/sv-fxhash" }
sv-lexer = { version = "0.4.0", path = "crates/sv-lexer" }
sv-preprocessor = { version = "0.4.0", path = "crates/sv-preprocessor" }
sv-syntax = { version = "0.4.0", path = "crates/sv-syntax" }
sv-scopes = { version = "0.4.0", path = "crates/sv-scopes" }
sv-checks = { version = "0.4.0", path = "crates/sv-checks" }
sv-ir = { version = "0.4.0", path = "crates/sv-ir" }
sv-expr = { version = "0.4.0", path = "crates/sv-expr" }
sv-semantic = { version = "0.4.0", path = "crates/sv-semantic" }
sv-netlist = { version = "0.4.0", path = "crates/sv-netlist" }
sv-btor2 = { version = "0.4.0", path = "crates/sv-btor2" }
sv-aiger = { version = "0.4.0", path = "crates/sv-aiger" }
sv-yosys = { version = "0.4.0", path = "crates/sv-yosys" }
svlang = { version = "0.4.0", path = "crates/svlang" }
svlang-model = { version = "0.4.0", path = "crates/svlang-model" }
svlang-lint = { version = "0.4.0", path = "crates/svlang-lint" }
svlang-lsp = { version = "0.4.0", path = "crates/svlang-lsp" }

[profile.release]
debug = 1

# Release binaries people download (the Release workflow): no debug info,
# stripped, optimized across crates.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "thin"
codegen-units = 1
